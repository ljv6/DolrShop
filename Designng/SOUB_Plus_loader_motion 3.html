
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolr Plus | شاشة التحميل</title>
  <style>

    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --loader-bg: #101113;
      --silver: #d4d4d8;
      --silver-bright: #f4f4f5;
    }

    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--loader-bg);
      color: #f4f4f5;
      overflow: hidden;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(ellipse at 50% 46%, rgba(190, 194, 200, .10) 0%, rgba(92, 96, 103, .055) 34%, transparent 67%),
        linear-gradient(145deg, #141517 0%, #101113 52%, #0c0d0f 100%);
      opacity: 1;
      visibility: visible;
      transition: opacity .7s ease, visibility .7s ease;
    }

    /* هالة فضية هادئة متناسقة مع الشعار */
    #loader::before {
      content: "";
      position: absolute;
      z-index: -1;
      top: calc(50% - 42px);
      left: 50%;
      width: min(78vw, 390px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(244, 244, 245, .20) 0%,
        rgba(212, 212, 216, .13) 22%,
        rgba(161, 161, 170, .075) 40%,
        rgba(113, 113, 122, .035) 56%,
        transparent 72%);
      filter: blur(15px);
      transform: translate(-50%, -50%) scale(.94);
      animation: glow-breathe 5s ease-in-out infinite;
      pointer-events: none;
    }

    #loader::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background: radial-gradient(ellipse at 50% 48%, transparent 22%, rgba(0, 0, 0, .30) 100%);
      pointer-events: none;
    }

    #loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-logo {
      display: block;
      width: clamp(190px, 42vw, 250px);
      max-width: 72vw;
      height: auto;
      object-fit: contain;
      position: relative;
      z-index: 1;
      filter: brightness(1.22) contrast(1.12) drop-shadow(0 0 10px rgba(244, 244, 245, .24)) drop-shadow(0 0 26px rgba(212, 212, 216, .16));
      animation: logo-zoom 2.8s ease-in-out .08s infinite;
    }

    .loader-track {
      position: relative;
      z-index: 1;
      width: clamp(132px, 34vw, 180px);
      height: 4px;
      margin-top: 24px;
      overflow: hidden;
      border: 1px solid rgba(212, 212, 216, .13);
      border-radius: 999px;
      background: rgba(161, 161, 170, .13);
      box-shadow: 0 0 16px rgba(212, 212, 216, .07), inset 0 1px 2px rgba(255, 255, 255, .05);
      direction: ltr;
    }

    .loader-bar {
      width: 42%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #77777e 0%, #c4c4ca 58%, #f4f4f5 100%);
      box-shadow: 0 0 9px rgba(228, 228, 231, .38), 0 0 18px rgba(161, 161, 170, .20);
      animation: loading-bar 1.8s cubic-bezier(.45, 0, .55, 1) infinite;
    }

    @keyframes loading-bar {
      0% { transform: translateX(-145%); opacity: .68; }
      50% { opacity: 1; }
      100% { transform: translateX(345%); opacity: .68; }
    }

    @keyframes glow-breathe {
      0%, 100% { opacity: .72; transform: translate(-50%, -50%) scale(.94); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
    }

    @keyframes logo-zoom {
      0%, 100% { transform: scale(.92); }
      50% { transform: scale(1.07); }
    }

    @keyframes logo-zoom-out {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(.72); }
    }

    #loader.is-hidden .loader-logo {
      animation: logo-zoom-out .38s ease-in both;
    }

    #loader.is-hidden .loader-track {
      opacity: 0;
      transform: translateY(7px) scaleX(.86);
      transition: opacity .35s ease, transform .4s ease;
    }

    @media (max-width: 480px) {
      #loader::before {
        top: calc(50% - 38px);
        width: min(92vw, 340px);
      }
      .loader-track { margin-top: 21px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
      .loader-bar { width: 100%; transform: none; }
      #loader { transition: none; }
    }
</style>
</head>
