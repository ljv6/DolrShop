<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dolr Plus | شاشة التحميل</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      overflow: hidden;
    }
    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      opacity: 1;
      visibility: visible;
      transition: opacity .8s ease, visibility .8s ease;
    }
    #loader.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-logo {
      display: block;
      width: 140px;
      max-width: 45vw;
      height: auto;
      object-fit: contain;
      position: relative;
      z-index: 1;
    }
    .loader-track {
      width: 120px;
      height: 2px;
      margin-top: 20px;
      overflow: hidden;
      background: rgba(255,255,255,.12);
      border-radius: 99px;
    }
    .loader-bar {
      width: 0;
      height: 100%;
      background: #2563eb;
      animation: loading-bar 1.5s ease-in-out infinite;
    }
    @keyframes loading-bar {
      0% { width: 0; transform: translateX(0); }
      50% { width: 100%; }
      100% { width: 0; transform: translateX(120px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader-bar { animation: none; width: 100%; }
      #loader { transition: none; }
    }
  </style>
</head>
