<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dolr Tv</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --accent-color: #e50914;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; }
        
        /* Navbar */
        nav { padding: 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); }
        .logo { font-size: 24px; font-weight: bold; color: var(--accent-color); cursor: pointer; }
        
        /* Containers */
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; margin-top: 20px; }
        
        /* Cards */
        .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; transition: transform 0.3s; cursor: pointer; }
        .card:hover { transform: scale(1.05); }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .card-body { padding: 15px; }

        /* Loader & Error */
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid var(--accent-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Hidden states */
        .hidden { display: none; }
        
        /* Video Player Area */
        #player-container { margin-bottom: 20px; }
        iframe { width: 100%; height: 500px; border: none; }
    </style>
</head>
<body>

<nav>
    <div class="logo" onclick="loadHome()">Dolr Tv</div>
    <input type="text" id="search" placeholder="بحث عن مسلسل..." onkeyup="filterShows()">
</nav>

<div class="container" id="app">
    <div id="content"></div>
</div>

<script>
    const API_BASE_URL = 'http://2.56.165.63/API/index.php';
    const contentDiv = document.getElementById('content');

    // دالة جلب البيانات الأساسية
    async function fetchAPI(endpoint) {
        try {
            const response = await fetch(`${API_BASE_URL}${endpoint}`);
            if (!response.ok) throw new Error('فشل في الاتصال بالخادم');
            return await response.json();
        } catch (error) {
            contentDiv.innerHTML = `<p style="color:red">خطأ: ${error.message}</p>`;
        }
    }

    // عرض القائمة الرئيسية
    async function loadHome() {
        contentDiv.innerHTML = '<div class="spinner"></div>';
        const data = await fetchAPI('?action=list'); // افترضنا وجود action=list
        if (!data || data.length === 0) { contentDiv.innerHTML = 'لا توجد مسلسلات'; return; }
        
        let html = '<div class="grid">';
        data.forEach(show => {
            html += `
                <div class="card" onclick="showDetails(${show.id})">
                    <img src="${show.poster}" alt="${show.title}">
                    <div class="card-body"><h3>${show.title}</h3></div>
                </div>`;
        });
        html += '</div>';
        contentDiv.innerHTML = html;
    }

    // عرض تفاصيل المسلسل
    async function showDetails(id) {
        contentDiv.innerHTML = '<div class="spinner"></div>';
        const show = await fetchAPI(`?action=details&id=${id}`);
        
        let html = `
            <h1>${show.title}</h1>
            <p>${show.description}</p>
            <div id="player-container"></div>
            <h3>الحلقات:</h3>
            <div class="grid">
                ${show.episodes.map(ep => `
                    <div class="card" onclick="playVideo('${ep.watch_url}')">
                        <div class="card-body"><h4>${ep.title}</h4></div>
                    </div>
                `).join('')}
            </div>
        `;
        contentDiv.innerHTML = html;
    }

    function playVideo(url) {
        document.getElementById('player-container').innerHTML = 
            `<iframe src="${url}" allowfullscreen></iframe>`;
        window.scrollTo(0,0);
    }

    // تشغيل التطبيق
    loadHome();
</script>
</body>
</html>
